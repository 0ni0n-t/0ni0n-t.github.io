<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">퍼징의 종류를 나누는 네 가지 기준</title>
  <desc id="d">입력 생성 방식, 대상 내부를 아는 정도, 실행 중 피드백 사용 여부, 실행 방식의 네 기준으로 퍼징 종류를 나눈 분류도</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a63d2f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94481c"/></marker>
  </defs>
  <style>
    text { font-family: "Nanum Gothic", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1b2733; }
    .h { font-size: 17px; font-weight: 800; }
    .b { font-size: 14px; font-weight: 700; }
    .s { font-size: 12.5px; }
    .x { font-size: 11.5px; fill: #4a5866; }
    .m { font-family: "Nanum Gothic Coding", Consolas, Menlo, monospace; font-size: 12px; }
    .g { fill: #2f6b4f; font-weight: 700; }
    .r { fill: #a63d2f; font-weight: 700; }
    .o { fill: #94481c; font-weight: 700; }
    .w { fill: #ffffff; }
  </style>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="30" y="38" class="h">퍼징은 네 가지 기준으로 나눠 볼 수 있습니다</text>
  <rect x="30" y="64" width="195" height="40" rx="6" fill="#1e3650"/>
  <text x="42" y="89" class="b w">① 입력을 어떻게 만드나</text>
  <rect x="30" y="122" width="195" height="68" rx="6" fill="#fbefe6" stroke="#94481c" stroke-width="2"/>
  <text x="42" y="148" class="b">mutation</text>
  <text x="42" y="170" class="x">가진 입력을 조금씩 변형</text>
  <rect x="30" y="206" width="195" height="68" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="42" y="232" class="b">generation</text>
  <text x="42" y="254" class="x">형식 규칙으로 처음부터 생성</text>
  <rect x="265" y="64" width="195" height="40" rx="6" fill="#1e3650"/>
  <text x="277" y="89" class="b w">② 대상 속을 얼마나 아나</text>
  <rect x="265" y="122" width="195" height="68" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="277" y="148" class="b">black-box</text>
  <text x="277" y="170" class="x">입출력만 봄</text>
  <rect x="265" y="206" width="195" height="68" rx="6" fill="#fbefe6" stroke="#94481c" stroke-width="2"/>
  <text x="277" y="232" class="b">grey-box</text>
  <text x="277" y="254" class="x">커버리지 등 가벼운 피드백</text>
  <rect x="265" y="290" width="195" height="68" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="277" y="316" class="b">white-box</text>
  <text x="277" y="338" class="x">소스를 분석해 조건을 계산</text>
  <rect x="500" y="64" width="195" height="40" rx="6" fill="#1e3650"/>
  <text x="512" y="89" class="b w">③ 실행 결과를 되먹이나</text>
  <rect x="500" y="122" width="195" height="68" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="512" y="148" class="b">blind(맹목)</text>
  <text x="512" y="170" class="x">결과와 무관하게 변형</text>
  <rect x="500" y="206" width="195" height="68" rx="6" fill="#fbefe6" stroke="#94481c" stroke-width="2"/>
  <text x="512" y="232" class="b">coverage-guided</text>
  <text x="512" y="254" class="x">새 경로를 연 입력을 주로 남김</text>
  <rect x="735" y="64" width="195" height="40" rx="6" fill="#1e3650"/>
  <text x="747" y="89" class="b w">④ 어떻게 실행하나</text>
  <rect x="735" y="122" width="195" height="68" rx="6" fill="#fbefe6" stroke="#94481c" stroke-width="2"/>
  <text x="747" y="148" class="b">fork</text>
  <text x="747" y="170" class="x">입력마다 새 프로세스</text>
  <rect x="735" y="206" width="195" height="68" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="747" y="232" class="b">persistent</text>
  <text x="747" y="254" class="x">프로세스 하나로 반복 호출</text>
  <rect x="735" y="290" width="195" height="68" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="747" y="316" class="b">in-process</text>
  <text x="747" y="338" class="x">퍼저가 대상과 한 몸</text>
  <text x="30" y="404" class="x">주황 칸: 이 글의 실습(AFL++)이 해당하는 쪽. 입력 변형, 실행 경로 피드백, 큰 틀은 grey-box.</text>
</svg>
