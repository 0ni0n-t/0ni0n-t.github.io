<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="620" height="180" role="img" aria-label="use-after-free 개념 그림">
  <style>text{font-family:"Nanum Gothic","Malgun Gothic",sans-serif}</style>
  <rect x="0" y="0" width="620" height="180" fill="#ffffff"/>
  <text x="100" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">① 메모리를 빌림</text>
  <rect x="25" y="44" width="150" height="74" rx="10" fill="#eef2f6" stroke="#1e3650" stroke-width="2"/>
  <text x="100" y="78" text-anchor="middle" font-size="13" fill="#1b2733">버퍼 (사용 중)</text>
  <text x="100" y="98" text-anchor="middle" font-size="11" fill="#5c6b7a">장치가 쓰는 공간</text>
  <line x1="185" y1="81" x2="223" y2="81" stroke="#5c6b7a" stroke-width="2"/>
  <polygon points="223,76 233,81 223,86" fill="#5c6b7a"/>
  <text x="310" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">② 다 써서 돌려줌</text>
  <rect x="235" y="44" width="150" height="74" rx="10" fill="#f6f8fa" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="310" y="78" text-anchor="middle" font-size="13" fill="#5c6b7a">빈 메모리</text>
  <text x="310" y="98" text-anchor="middle" font-size="11" fill="#5c6b7a">해제됨</text>
  <line x1="395" y1="81" x2="433" y2="81" stroke="#5c6b7a" stroke-width="2"/>
  <polygon points="433,76 443,81 433,86" fill="#5c6b7a"/>
  <text x="520" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#a63d2f">③ 다시 읽음 = 오류</text>
  <rect x="445" y="44" width="150" height="74" rx="10" fill="#f6f8fa" stroke="#a63d2f" stroke-width="2"/>
  <text x="520" y="78" text-anchor="middle" font-size="13" fill="#a63d2f">use-after-free</text>
  <text x="520" y="98" text-anchor="middle" font-size="11" fill="#5c6b7a">돌려준 자리를 읽음</text>
</svg>
