<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">세 퍼저의 구조 비교</title>
  <desc id="d">AFL++는 컴파일 때 계측하고 별도 프로세스에서 대상을 실행, libFuzzer는 대상과 같은 프로세스 안에서 함수를 호출, Jackalope는 이미 만들어진 바이너리를 실행 중에 계측하는 구조 비교</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a63d2f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94481c"/></marker>
  </defs>
  <style>
    text { font-family: "Nanum Gothic", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1b2733; }
    .h { font-size: 17px; font-weight: 800; }
    .b { font-size: 14px; font-weight: 700; }
    .s { font-size: 12.5px; }
    .x { font-size: 11.5px; fill: #4a5866; }
    .m { font-family: "Nanum Gothic Coding", Consolas, Menlo, monospace; font-size: 12px; }
    .g { fill: #2f6b4f; font-weight: 700; }
    .r { fill: #a63d2f; font-weight: 700; }
    .o { fill: #94481c; font-weight: 700; }
    .w { fill: #ffffff; }
  </style>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="30" y="38" class="h">세 퍼저는 계측을 어디서 하고, 대상을 어떻게 돌리는지가 다릅니다</text>
  <rect x="30" y="64" width="290" height="46" rx="6" fill="#1e3650"/>
  <text x="44" y="84" class="b w">AFL++</text>
  <text x="44" y="101" class="s w">소스를 컴파일할 때 계측</text>
  <rect x="30" y="124" width="290" height="116" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="44" y="148" class="b">만드는 쪽</text>
  <text x="44" y="172" class="s">소스 코드</text>
  <text x="44" y="192" class="x">→ afl-cc 로 컴파일(계측 삽입)</text>
  <text x="44" y="212" class="x">→ 계측된 실행 파일</text>
  <rect x="30" y="262" width="290" height="116" rx="6" fill="#fbefe6" stroke="#94481c" stroke-width="2"/>
  <text x="44" y="286" class="b">돌리는 쪽</text>
  <text x="44" y="310" class="s">afl-fuzz (별도 프로세스)</text>
  <text x="44" y="330" class="x">입력을 보내고 결과를 지켜봄</text>
  <text x="44" y="350" class="x">↔ 대상 프로세스(fork server)</text>
  <line x1="175" y1="241" x2="175" y2="260" stroke="#1b2733" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="396" width="290" height="50" rx="6" fill="#ffffff" stroke="#2f6b4f" stroke-width="2"/>
  <text x="44" y="416" class="g">잘 맞는 상황</text>
  <text x="44" y="435" class="x">소스가 있고 프로그램 전체를 돌릴 때</text>
  <rect x="335" y="64" width="290" height="46" rx="6" fill="#1e3650"/>
  <text x="349" y="84" class="b w">libFuzzer</text>
  <text x="349" y="101" class="s w">퍼저와 대상이 한 프로세스</text>
  <rect x="335" y="124" width="290" height="116" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="349" y="148" class="b">만드는 쪽</text>
  <text x="349" y="172" class="s">소스 코드 + fuzz target 함수</text>
  <text x="349" y="192" class="x">→ clang -fsanitize=fuzzer</text>
  <text x="349" y="212" class="x">→ 하나의 실행 파일</text>
  <rect x="335" y="262" width="290" height="116" rx="6" fill="#fbefe6" stroke="#94481c" stroke-width="2"/>
  <text x="349" y="286" class="b">돌리는 쪽</text>
  <text x="349" y="310" class="s">한 프로세스 안에서</text>
  <text x="349" y="330" class="x">엔진이 함수에 입력을 넘겨</text>
  <text x="349" y="350" class="x">같은 프로세스에서 반복 호출</text>
  <line x1="480" y1="241" x2="480" y2="260" stroke="#1b2733" stroke-width="2" marker-end="url(#a)"/>
  <rect x="335" y="396" width="290" height="50" rx="6" fill="#ffffff" stroke="#2f6b4f" stroke-width="2"/>
  <text x="349" y="416" class="g">잘 맞는 상황</text>
  <text x="349" y="435" class="x">라이브러리 함수를 빠르게 때릴 때</text>
  <rect x="640" y="64" width="290" height="46" rx="6" fill="#1e3650"/>
  <text x="654" y="84" class="b w">Jackalope</text>
  <text x="654" y="101" class="s w">이미 만든 바이너리를 실행 중 계측</text>
  <rect x="640" y="124" width="290" height="116" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="654" y="148" class="b">만드는 쪽</text>
  <text x="654" y="172" class="s">소스 없는 실행 파일</text>
  <text x="654" y="192" class="x">→ TinyInst 로 실행 중 계측</text>
  <text x="654" y="212" class="x">(소스가 있을 땐 sancov도 가능)</text>
  <rect x="640" y="262" width="290" height="116" rx="6" fill="#fbefe6" stroke="#94481c" stroke-width="2"/>
  <text x="654" y="286" class="b">돌리는 쪽</text>
  <text x="654" y="310" class="s">Jackalope 퍼저</text>
  <text x="654" y="330" class="x">샘플을 파일/공유 메모리로 전달</text>
  <text x="654" y="350" class="x">대상 프로세스를 감시</text>
  <line x1="785" y1="241" x2="785" y2="260" stroke="#1b2733" stroke-width="2" marker-end="url(#a)"/>
  <rect x="640" y="396" width="290" height="50" rx="6" fill="#ffffff" stroke="#2f6b4f" stroke-width="2"/>
  <text x="654" y="416" class="g">잘 맞는 상황</text>
  <text x="654" y="435" class="x">소스가 없는 프로그램(Windows, macOS 포함)</text>
</svg>
