<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="t d">
  <title id="t">HyperAudit 구성도</title>
  <desc id="d">감사 대상 VM 안의 숨은 영역에 하이퍼바이저가 수집기와 로그 버퍼를 넣고, Secure VM이 공유 버퍼에서 로그를 비동기로 가져가 저장하는 구조. 번호 1~6은 시스템 콜 하나가 처리되는 순서.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94481c"/></marker>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e7b9b2" stroke-width="3"/></pattern>
  </defs>
  <style>
    text { font-family: "Nanum Gothic", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1b2733; }
    .h { font-size: 17px; font-weight: 800; }
    .b { font-size: 14px; font-weight: 700; }
    .s { font-size: 12.5px; }
    .x { font-size: 11.5px; fill: #4a5866; }
    .m { font-family: "Nanum Gothic Coding", Consolas, Menlo, monospace; font-size: 12px; }
    .st { font-size: 12.5px; font-weight: 700; }
    .w { fill: #ffffff; }
  </style>

  <rect width="960" height="570" fill="#ffffff"/>

  <!-- 감사 대상 VM -->
  <rect x="20" y="20" width="600" height="440" rx="6" fill="#eff2f5" stroke="#1e3650" stroke-width="2"/>
  <text x="40" y="48" class="h">감사 대상 VM</text>

  <text x="45" y="78" class="x">사용자 공간</text>
  <rect x="45" y="88" width="200" height="50" rx="4" fill="#ffffff" stroke="#c7d2dc"/>
  <text x="145" y="118" class="b" text-anchor="middle">앱 (사용자 프로그램)</text>

  <line x1="35" y1="172" x2="270" y2="172" stroke="#c7d2dc" stroke-dasharray="5 4"/>
  <text x="45" y="196" class="x">게스트 커널</text>

  <rect x="45" y="255" width="200" height="120" rx="4" fill="#ffffff" stroke="#c7d2dc"/>
  <text x="145" y="281" class="b" text-anchor="middle">원래 게스트 커널</text>
  <text x="145" y="305" class="m" text-anchor="middle">entry_SYSCALL_64</text>
  <text x="145" y="327" class="m" text-anchor="middle">do_syscall_64</text>
  <text x="145" y="358" class="x" text-anchor="middle" style="fill:#a63d2f">공격자가 장악할 수 있음</text>

  <!-- ① -->
  <line x1="180" y1="138" x2="180" y2="253" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="190" y="222" class="st">① syscall</text>

  <!-- 숨은 영역 -->
  <rect x="290" y="65" width="315" height="375" rx="4" fill="#ffe9d9" stroke="#94481c" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="305" y="88" class="b" style="fill:#94481c">숨은 영역</text>
  <text x="305" y="106" class="x">게스트 커널이 모르는 메모리</text>

  <!-- 로그 버퍼 + 가드 -->
  <rect x="490" y="118" width="95" height="38" fill="url(#h)" stroke="#a63d2f" stroke-dasharray="4 3"/>
  <text x="537.5" y="142" class="s" text-anchor="middle" style="fill:#a63d2f">가드 페이지</text>
  <rect x="490" y="160" width="95" height="54" fill="#f4b183" stroke="#94481c" stroke-width="1.6"/>
  <text x="537.5" y="185" class="b" text-anchor="middle">로그 버퍼</text>
  <text x="537.5" y="203" class="x" text-anchor="middle" style="fill:#5a2a10">위치 무작위</text>
  <rect x="490" y="218" width="95" height="38" fill="url(#h)" stroke="#a63d2f" stroke-dasharray="4 3"/>
  <text x="537.5" y="242" class="s" text-anchor="middle" style="fill:#a63d2f">가드 페이지</text>
  <text x="537.5" y="275" class="x" text-anchor="middle">건드리면 트랩</text>

  <!-- 수집기 -->
  <rect x="305" y="290" width="160" height="130" rx="4" fill="#ffffff" stroke="#94481c" stroke-width="1.6"/>
  <text x="385" y="316" class="b" text-anchor="middle">숨은 수집기</text>
  <text x="385" y="342" class="st" text-anchor="middle">③ 번호·인자·PID 수집</text>
  <text x="385" y="372" class="x" text-anchor="middle">코드: 실행 전용(XO)</text>
  <text x="385" y="392" class="x" text-anchor="middle">데이터: 읽기 전용(RO)</text>

  <!-- ② ④ -->
  <line x1="245" y1="310" x2="303" y2="310" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="274" y="302" class="st" text-anchor="middle">② 점프</text>
  <line x1="305" y1="360" x2="247" y2="360" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="274" y="380" class="st" text-anchor="middle">④ 호출</text>

  <!-- ⑤ -->
  <path d="M440,290 V187 H488" fill="none" stroke="#94481c" stroke-width="1.6" marker-end="url(#o)"/>
  <text x="432" y="245" class="st" text-anchor="end" style="fill:#94481c">⑤ 기록</text>

  <!-- Secure VM -->
  <rect x="700" y="20" width="240" height="440" rx="6" fill="#eef5f1" stroke="#2f6b4f" stroke-width="2"/>
  <text x="720" y="48" class="h">Secure VM</text>
  <text x="720" y="68" class="x">신뢰하는 별도 VM</text>

  <rect x="720" y="164" width="200" height="46" rx="4" fill="#ffffff" stroke="#2f6b4f"/>
  <text x="820" y="192" class="b" text-anchor="middle">로그 수신</text>
  <rect x="720" y="236" width="200" height="46" rx="4" fill="#ffffff" stroke="#2f6b4f"/>
  <text x="820" y="264" class="b" text-anchor="middle">압축 (평균 약 17바이트)</text>
  <rect x="720" y="308" width="200" height="46" rx="4" fill="#ffffff" stroke="#2f6b4f"/>
  <text x="820" y="336" class="b" text-anchor="middle">디스크에 저장</text>
  <rect x="720" y="380" width="200" height="46" rx="4" fill="#ffffff" stroke="#2f6b4f"/>
  <text x="820" y="408" class="b" text-anchor="middle">해석 (fd → 파일 이름)</text>
  <line x1="820" y1="210" x2="820" y2="234" stroke="#2f6b4f" stroke-width="1.6" marker-end="url(#g)"/>
  <line x1="820" y1="282" x2="820" y2="306" stroke="#2f6b4f" stroke-width="1.6" marker-end="url(#g)"/>
  <line x1="820" y1="354" x2="820" y2="378" stroke="#2f6b4f" stroke-width="1.6" marker-end="url(#g)"/>

  <!-- ⑥ -->
  <line x1="585" y1="187" x2="718" y2="187" stroke="#2f6b4f" stroke-width="2.2" marker-end="url(#g)"/>
  <text x="660" y="176" class="st" text-anchor="middle" style="fill:#2f6b4f">⑥ 공유 버퍼</text>
  <text x="660" y="206" class="x" text-anchor="middle">비동기로 가져감</text>

  <!-- 하이퍼바이저 -->
  <rect x="20" y="490" width="920" height="64" rx="6" fill="#1e3650"/>
  <text x="480" y="516" class="b w" text-anchor="middle">하이퍼바이저 (신뢰)</text>
  <text x="480" y="539" class="s w" text-anchor="middle">VM 부팅 시 수집기를 숨은 영역에 주입하고, stage-2 권한으로 보호 (코드 XO · 데이터 RO · 가드 페이지 미매핑)</text>
  <line x1="447" y1="490" x2="447" y2="442" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="457" y="472" class="st">주입·보호</text>
</svg>
