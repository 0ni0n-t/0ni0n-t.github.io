<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
{% include head.html %}
</head>
<body data-panel="closed">
  <div class="sky" aria-hidden="true"></div>
  <div class="site">
    <h1 class="sr">{{ site.title }} 클라우드 보안 블로그</h1>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="menu" aria-label="주 메뉴">
          <a id="about-link" href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://github.com/{{ site.github_username }}">GitHub</a>
        </nav>
      </div>
    </header>
    <aside class="sidebar">
      <p class="sidebar-title">Categories</p>
      <nav class="side-list" id="cats" aria-label="메인 카테고리">
        {%- for s in site.data.subnets %}
        {%- assign n = site.categories[s.slug] | size %}
        <a class="cat" href="{{ '/categories/' | append: s.slug | append: '/' | relative_url }}"><span>{{ s.name }}</span><span class="count">{{ n }}</span></a>
        {%- endfor %}
      </nav>
    </aside>
    <section class="stage" id="stage" aria-label="블로그 VPC 3D 구성도">
      <div id="labels"></div>
      <div class="stage-tools">
        <button type="button" class="tool tool-feed" id="to-feed">글 보기</button>
        <button type="button" class="tool" id="overview">전체 구성도 보기</button>
      </div>
      <p class="hint">게이트웨이 → 라우터 → 카테고리. 카테고리가 서브넷, 흰 블록이 세부 카테고리입니다. 누르면 내용이 나옵니다.</p>
      <noscript><p class="nogl">3D 구성도는 스크립트가 켜져 있어야 보입니다. 왼쪽 카테고리를 누르면 글 목록으로 이동합니다.</p></noscript>
    </section>
    <div class="sheet" id="sheet" aria-live="polite"></div>
    <div class="sheet-resize" id="sheet-resize" role="separator" aria-orientation="vertical" aria-label="내용 창 너비 조절" title="끌어서 너비 조절" tabindex="0"></div>
  </div>
  <script type="application/json" id="vpc-data">
    {"desc":{{ site.description | jsonify }},"subnets":{{ site.data.subnets | jsonify }},"posts":[{%- for p in site.posts -%}
      {"title":{{ p.title | jsonify | replace: '</', '<\/' }},"url":{{ p.url | relative_url | jsonify }},"date":{{ p.date | date: '%Y-%m-%d' | jsonify }},"cat":{{ p.categories | first | jsonify }},"sub":{{ p.sub | jsonify }}}{% unless forloop.last %},{% endunless %}
    {%- endfor -%}]}
  </script>
  <script src="{{ '/assets/js/vpc.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
