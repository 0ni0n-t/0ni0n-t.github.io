---
layout: default
---
<article class="page">
  <header class="page-head">
    <p class="cmd"><span class="prompt">$</span> cat {{ page.url | remove_first: '/' | default: 'index' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  </header>
  <div class="content">
    {{ content }}
  </div>
</article>
