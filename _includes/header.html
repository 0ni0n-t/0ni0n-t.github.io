<header class="site-header">
  <div class="shell header-inner">
    <button type="button" id="sidebar-toggle" class="icon-btn" aria-controls="sidebar" aria-expanded="true" aria-label="카테고리 사이드바 접기/펴기" title="사이드바 접기/펴기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
    </button>
    <a class="brand" href="{{ '/' | relative_url }}"><span class="prompt">root@0ni0n__T:~#</span><span class="cursor" aria-hidden="true">_</span></a>
    <nav class="site-nav" aria-label="주 메뉴">
      <ul>
        {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        {% assign page_url = page.url | relative_url %}
        <li><a href="{{ item_url }}"{% if page_url == item_url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
