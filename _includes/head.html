<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<script>
  (function () {
    var s = null;
    try { s = localStorage.getItem('sidebar'); } catch (e) {}
    var narrow = window.matchMedia('(max-width: 900px)').matches;
    document.documentElement.setAttribute('data-sidebar', narrow ? 'closed' : (s === 'closed' ? 'closed' : 'open'));
  })();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
{%- if page.layout == 'home' %}
<link rel="stylesheet" href="{{ '/assets/css/vpc.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{%- else %}
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{%- endif %}
