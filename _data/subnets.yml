# VPC 구성도의 서브넷 정의. slug 는 _config.yml 의 category_names 와 같아야 하고, 순서도 맞춘다.
# allow, deny 는 그 카테고리에 올리는 글과 올리지 않는 글의 기준이다. 구성도 값(CIDR, sg)은 실제 AWS 자원이 아니다.
# subs 는 세부 카테고리이며 항목마다 흰 블록이 하나 생긴다. 글의 front matter 에 sub: "이름" 을 쓰면 그 블록에 들어간다.
- slug: dev
  name: 개발
  cidr: 10.0.1.0/24
  about: 만들면서 배운 것을 기록합니다. 웹·클라우드 프로젝트의 설계, 구현, 그리고 보안 관점에서 고친 점을 함께 적습니다.
  allow:
    - 웹과 클라우드 프로젝트의 설계와 구현
    - 보안 관점에서 고친 점
  deny: []
  subs:
    - { name: 웹 서비스, text: 직접 만든 웹 서비스의 설계와 구현을 기록합니다. }
    - { name: 클라우드 인프라, text: 클라우드 환경을 구성하고 코드로 관리한 과정을 기록합니다. }
    - { name: 보안 도구, text: 점검과 분석을 돕는 도구를 만든 과정을 기록합니다. }
    - { name: 자동화·CI/CD, text: 배포와 보안 점검을 자동화한 방법을 기록합니다. }
- slug: ctf-wargame
  name: CTF / Wargame
  cidr: 10.0.2.0/24
  about: CTF와 워게임을 풀며 배운 기법을 정리합니다. 종료되었고 공개가 허용된 문제만 다룹니다.
  allow:
    - 종료되었고 공개가 허용된 문제
  deny:
    - 진행 중인 대회의 문제
    - 풀이 공개가 허용되지 않은 문제
  subs:
    - { name: Web, text: 웹 애플리케이션 취약점을 다루는 문제입니다. }
    - { name: Pwnable, text: 메모리 취약점을 이용해 프로그램을 공격하는 문제입니다. }
    - { name: Reversing, text: 실행 파일을 분석해 동작을 알아내는 문제입니다. }
    - { name: Crypto, text: 암호 구현과 설계의 약점을 찾는 문제입니다. }
    - { name: Forensics, text: 로그와 파일에서 사건의 흔적을 찾는 문제입니다. }
    - { name: Cloud, text: 클라우드 권한과 설정의 약점을 다루는 문제입니다. }
- slug: bug-bounty
  name: Bug Bounty
  cidr: 10.0.3.0/24
  about: 버그바운티 공부 방법, 방법론, 그리고 프로그램 정책상 공개가 허용된 내용만 기록합니다. 프로그램이 승인한 scope 안에서만 활동합니다.
  allow:
    - 공부 방법과 방법론
    - 프로그램 정책상 공개가 허용된 내용
  deny:
    - 제보 전이거나 공개 승인이 없는 취약점의 세부 정보
  subs:
    - { name: 방법론, text: 프로그램을 고르고 점검을 진행하는 방법을 정리합니다. }
    - { name: 정찰, text: 점검 범위 안에서 대상을 파악하는 방법을 정리합니다. }
    - { name: 취약점 유형, text: 자주 나오는 취약점의 원리와 방어법을 정리합니다. }
    - { name: 공개 사례, text: 공개가 허용된 사례를 읽고 배운 점을 정리합니다. }
- slug: papers-conferences
  name: 논문 / 컨퍼런스
  cidr: 10.0.4.0/24
  about: 읽은 보안 논문과 컨퍼런스 발표를 정리합니다. 원문 링크와 함께, 요약과 내 생각을 구분해서 적습니다.
  allow:
    - 보안 논문과 컨퍼런스 발표 정리
    - 원문 링크, 요약과 내 생각의 구분
  deny: []
  subs:
    - { name: 논문 리뷰, text: 읽은 보안 논문을 요약하고 내 생각을 따로 적습니다. }
    - { name: 컨퍼런스 발표, text: 보안 컨퍼런스 발표의 핵심을 정리합니다. }
    - { name: 런타임 탐지, text: 실행 중인 시스템에서 공격을 찾아내는 연구를 다룹니다. }
    - { name: 가상화 보안, text: 가상 머신과 하이퍼바이저의 보안 연구를 다룹니다. }
- slug: tech-docs
  name: 블로그 / 기술문서
  cidr: 10.0.5.0/24
  about: 개념 정리, 도구 사용법, 공식 문서를 읽고 요약한 글을 모읍니다. 참고한 원문 링크를 함께 남깁니다.
  allow:
    - 개념 정리와 도구 사용법
    - 공식 문서 요약과 원문 링크
  deny: []
  subs:
    - { name: AWS, text: AWS 서비스의 개념과 보안 설정을 정리합니다. }
    - { name: IAM, text: 사용자와 권한을 안전하게 관리하는 방법을 정리합니다. }
    - { name: 쿠버네티스, text: 쿠버네티스의 구조와 보안 설정을 정리합니다. }
    - { name: 컨테이너, text: 컨테이너의 동작 원리와 격리 방식을 정리합니다. }
    - { name: 네트워크, text: 클라우드 네트워크 구성과 접근 통제를 정리합니다. }
    - { name: 리눅스·커널, text: 리눅스와 커널의 동작 원리를 보안 관점에서 정리합니다. }
- slug: contests-certs
  name: 공모전 / 자격증
  cidr: 10.0.6.0/24
  about: 공모전 참여 과정과 자격증 공부 기록을 남깁니다. 결과보다 준비하면서 배운 점을 중심으로 씁니다.
  allow:
    - 공모전 참여 과정과 자격증 공부 기록
    - 준비하면서 배운 점
  deny: []
  subs:
    - { name: 공모전, text: 참여 과정과 준비하며 배운 점을 기록합니다. }
    - { name: AWS 자격증, text: AWS 자격증 공부 방법과 정리한 내용을 기록합니다. }
    - { name: 쿠버네티스 자격증, text: 쿠버네티스 자격증 실습 내용을 기록합니다. }
    - { name: 보안 자격증, text: 보안 자격증 공부 과정을 기록합니다. }
